# PostgreSQL. Live: Supabase (DATABASE_URL on Render).
#
# prepared_statements / advisory_locks are off everywhere: Supabase's connection
# pooler hands each query a different connection, and Rails' cached ("prepared")
# queries then fail with: prepared statement "a1" already exists / does not exist.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  prepared_statements: false
  advisory_locks: false

# Your own computer (set these in .env)
local: &local
  <<: *default
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>

development:
  <<: *local
  database: <%= ENV.fetch("DB_NAME") { "honeysucklepub_api_development" } %>

test:
  <<: *local
  database: hps_test

production:
  <<: *default
  # Unquoted on purpose: when DATABASE_URL is not set (e.g. on a laptop) this is
  # empty instead of "", which would stop every database command, even in development.
  url: <%= ENV["DATABASE_URL"] %>